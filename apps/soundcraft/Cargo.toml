[package]
name = "soundcraft"
description = "SoundCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "soundcraft"

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see soundcraft-playback's `asio` feature).
asio = ["soundcraft-playback/asio"]
# JACK / pipewire-jack audio on Linux and the BSDs (see soundcraft-playback's `jack` feature).
jack = ["soundcraft-playback/jack"]

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-playback.workspace = true
soundcraft-vst2-host.workspace = true
soundcraft-vst3-host.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-dsp.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

# Picks the X11 (XWayland) backend for the main window on Linux, so plugin editors (X11 windows)
# can be transient for it; the same winit eframe already uses.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[build-dependencies]
# Icon + VERSIONINFO for soundcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
